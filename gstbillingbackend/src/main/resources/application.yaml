server:
  port: 9999

spring:
  application:
    name: gstbillingbackend

  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/gst_billing_db
    username: postgres
    password: Webapp@123

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  #GMail Properties
  mail:
    host: smtp.gmail.com
    port: 587
    username:
    password:
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  #Multipart files configuration
  servlet:
    multipart:
      enabled: true
      max-file-size: 5MB
      max-request-size: 5MB
      file-size-threshold: 3kb

